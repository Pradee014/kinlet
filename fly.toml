# Fly.io config. The app name is set by the deploy workflow (FLY_APP) or by `fly launch`.
app = "kinlet"
primary_region = "ord"

[build]

[env]
  PORT = "8080"
  KINLET_DATA = "/data"
  # KINLET_PUBLIC_URL is set by the deploy workflow to https://<app>.fly.dev

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "kinlet_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
