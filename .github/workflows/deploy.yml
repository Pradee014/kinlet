name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  fly:
    runs-on: ubuntu-latest
    if: ${{ vars.FLY_APP != '' || true }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'kinlet' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no token
        id: tok
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "No FLY_API_TOKEN secret; skipping deploy."; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.tok.outputs.skip != 'true'
      - name: Create app and volume if missing
        if: steps.tok.outputs.skip != 'true'
        run: |
          flyctl apps create "$FLY_APP" --org personal || true
          flyctl volumes create kinlet_data --app "$FLY_APP" --region ord --size 1 --yes || true
      - name: Deploy
        if: steps.tok.outputs.skip != 'true'
        run: |
          flyctl deploy --app "$FLY_APP" --remote-only --ha=false \
            --env KINLET_PUBLIC_URL="https://$FLY_APP.fly.dev"
